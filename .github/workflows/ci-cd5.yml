          sudo mv dockersshield /usr/local/bin/

      - name: 🔍 Run DockerShield
        run: |
          dockersshield --image ${{ env.IMAGE_FULL }} --output json > dockersshield.json

      - name: 📤 Upload results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dockersshield-results
          path: dockersshield.json
          retention-days: 7

  # ---------- SCAN 10: DOCKLENS (LEVE) ----------
  docklens-scan:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download image tar
        uses: actions/download-artifact@v8
        with:
          name: docker-image-tar
          path: /tmp

      - name: 📦 Load image
        run: docker load -i ${{ env.IMAGE_TAR }}

      - name: 📦 Install Docklens
        run: |
          curl -sSfL https://github.com/docklens/docklens/releases/latest/download/docklens-linux-amd64 -o docklens
          chmod +x docklens
          sudo mv docklens /usr/local/bin/

      - name: 🔍 Run Docklens (non-interactive)
        run: |
