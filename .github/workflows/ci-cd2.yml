name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ion-desafio-devops-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # ============================================
      # TRIVY SCAN
      # ============================================
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'

      - name: Generate Trivy report
        run: |
          echo "## 🔒 Trivy Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "trivy-results.sarif" ]; then
            CRITICAL=$(grep -o '"severity":"critical"' trivy-results.sarif | wc -l || echo "0")
            HIGH=$(grep -o '"severity":"high"' trivy-results.sarif | wc -l || echo "0")
            MEDIUM=$(grep -o '"severity":"medium"' trivy-results.sarif | wc -l || echo "0")
            LOW=$(grep -o '"severity":"low"' trivy-results.sarif | wc -l || echo "0")
            
            echo "| 🔴 **Critical** | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 **High** | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 **Medium** | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 **Low** | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "**Total:** $((CRITICAL + HIGH + MEDIUM + LOW))" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 7

      # ============================================
      # GRYPE SCAN
      # ============================================
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype version

      - name: Scan image with Grype
        run: |
          grype ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }} -o json > grype-results.json
          grype ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }} -o table > grype-results.txt

      - name: Generate Grype report
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔐 Grype Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "grype-results.json" ]; then
            CRITICAL=$(grep -o '"severity":"Critical"' grype-results.json | wc -l || echo "0")
            HIGH=$(grep -o '"severity":"High"' grype-results.json | wc -l || echo "0")
            MEDIUM=$(grep -o '"severity":"Medium"' grype-results.json | wc -l || echo "0")
            LOW=$(grep -o '"severity":"Low"' grype-results.json | wc -l || echo "0")
            
            echo "| 🔴 **Critical** | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 **High** | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 **Medium** | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 **Low** | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "**Total:** $((CRITICAL + HIGH + MEDIUM + LOW))" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Show Grype summary in logs
        run: |
          echo "📊 Grype Scan Results:"
          echo "========================================"
          cat grype-results.txt
          echo "========================================"

      - name: Upload Grype results
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: |
            grype-results.json
            grype-results.txt
          retention-days: 7

      # ============================================
      # GERAR SBOM COM GRYPE (OPCIONAL)
      # ============================================
      - name: Generate SBOM with Grype
        run: |
          grype ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }} -o syft-json > sbom.json
          
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 7
