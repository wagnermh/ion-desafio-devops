name: Build, Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ion-desafio-devops-app
  REGISTRY: docker.io
  GO_VERSION: '1.26'

jobs:
  # ============================================
  # JOB 1: TESTES GOLANG
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true  # ✅ Cache automático para Go

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Run linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
          skip-cache: false

      - name: Build application
        run: go build -v ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.*
          retention-days: 7

  # ============================================
  # JOB 2: BUILD E PUSH DA IMAGEM DOCKER
  # ============================================
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.${{ github.run_number }}
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Desafio DevOps - Golang Application
            org.opencontainers.image.version=1.${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
            
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            BUILD_NUMBER=${{ github.run_number }}
            COMMIT_SHA=${{ github.sha }}
          
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          
      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Check image size
        run: |
          IMAGE_SIZE=$(docker image inspect ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }} --format='{{.Size}}' | awk '{print int($1/1024/1024)" MB"}')
          echo "📦 Image size: $IMAGE_SIZE"
          
          # Alerta se a imagem for muito grande (> 100MB para Go)
          SIZE_BYTES=$(docker image inspect ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }} --format='{{.Size}}')
          if [ $SIZE_BYTES -gt 104857600 ]; then
            echo "⚠️ WARNING: Image size exceeds 100MB. Consider optimizing your Dockerfile."
          fi

  # ============================================
  # JOB 4: NOTIFICAÇÃO (OPCIONAL)
  # ============================================
  notify:
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send status notification
        run: |
          STATUS="${{ needs.build-and-push.result }}"
          if [ "$STATUS" == "success" ]; then
            echo "✅ Pipeline completed successfully!"
            echo "📦 Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:1.${{ github.run_number }}"
          else
            echo "❌ Pipeline failed!"
            echo "Check the logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          
          echo "📊 Pipeline Summary:"
          echo "--------------------"
          echo "✅ Tests: ${{ needs.test.result }}"
          echo "🏗️ Build: ${{ needs.build-and-push.result }}"
          echo "🚀 Deploy: ${{ needs.deploy.result }}"
